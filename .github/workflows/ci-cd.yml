name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    # Testler AKTİF — Node yerleşik test runner (node --test) ile çalışır.
    # backend/test/smoke.test.js içindeki duman testlerini koşar.
    - name: Run Tests
      run: npm test

    # Backend Docker imajını derle (Dockerfile backend/ içinde, port 3000)
    - name: Build Docker Image
      run: docker build -t yemekimnerde-api:latest .
