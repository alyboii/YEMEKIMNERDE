name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    # Test komutu şu an projede bulunmuyor (sadece "jest" belirtilmiş ama test dosyası yok). 
    # Varsa npm test komutu çalışacak, yoksa hata almamak için şimdilik devre dışı bırakıyoruz.
    # - name: Run Tests
    #   run: npm test

    - name: Build Docker Image
      run: docker build -t yemekimnerde-api:latest .
