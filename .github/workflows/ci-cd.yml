name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    # Testler AKTİF — Node yerleşik test runner (node --test) ile çalışır.
    # backend/test/smoke.test.js içindeki duman testlerini koşar.
    - name: Run Tests
      run: npm test

    # Backend Docker imajını derle (PR'larda da çalışır — build doğrulaması)
    - name: Build Docker Image
      run: docker build -t yemekimnerde-api:latest .

  # ─────────────────────────────────────────────
  # CD — Docker image'larını derleyip Docker Hub'a PUSH eder
  # Sadece main'e push'ta çalışır (PR'da değil). Secret gerektirir.
  # ─────────────────────────────────────────────
  push-docker-image:
    name: Build & Push Docker Images (CD)
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push BACKEND image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yemekimnerede-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/yemekimnerede-backend:${{ github.sha }}

      - name: Build & push FRONTEND image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yemekimnerede-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/yemekimnerede-frontend:${{ github.sha }}
