version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: yemekimnerede_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - yemek_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: yemekimnerede_rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ default port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - yemek_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yemekimnerede_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/yemekimnerede
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - yemek_network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

networks:
  yemek_network:
    driver: bridge

volumes:
  mongodb_data:
